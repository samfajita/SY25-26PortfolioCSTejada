<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Q3 2nd Graded Exercise">
    <meta name="keywords" content="HTML Forms">
    <meta name="author" content="SD Tejada">
    <title>Sample Form</title>
    <!-- updated external css link to show how to share it between repository -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="../../styles.css" />
    <link rel="icon" href="../../assets/pshslogo.png" sizes="32x32" type="image/png">
   <style>
      body {
        padding: 25px;
        font-family: arial;
        width: 80%;
        margin-left: 10%;
        background-color: rgba(128, 128, 128, 0.075)
        }

        .title {
            color: rgb(241, 197, 255);
        }

        fieldset:nth-child(2) {
             margin-top: 20px;
        }

        fieldset {
          background-color: #f0f8ff; /* Light blue background */
          border: 2px solid #4CAF50; /* Green border */
          border-radius: 8px; /* Rounded corners */
        }


        legend {
            background: gray;
            color: bisque;
            padding: 5px;
        }
        label {
             margin: 5%;
        }
        input:focus {
            background-color:rgb(0, 255, 191);
        }

        textarea:focus {
            background-color:rgb(0, 255, 191);
        }
      
        
    </style>
  </head>
  <body>
     <header>
        <div>
            <img src="../../assets/pshslogo.png" alt="pshs logo" 
               title="The Official Logo" width="50px" height="50px" />
            <h1>
                Sample Use of HTML Form    
            </h1>
            <h3>by SD Tejada </h3>
        </div>
        <nav class="navbar">
            <a href="../index.html"> Home </a>
            <a href="registered.html"> Show Saved Accounts </a>
        </nav>
    </header>
    <section>
      <h1 class="title">Sign-up Page</h1>
      <form id="dForm">
        <fieldset>
          <legend>Personal Information</legend><br/>
          <label> Student ID: 
            <input type="number" name="StudentID" id="ID" required />
          </label><br/><br/>
          <label> Full Name:
            <input type="text" name="fullName" id="fullName" required />
          </label><br/><br/>
          <label> Birthday:
            <input type="date" name="birthDay" id="birthDay" />
          </label><br/><br/>
          <label> Email Address:
            <input type="text" name="emailAddress" id="emailAddress" required />
          </label><br/><br/>
          <label> 
        </fieldset> 
        <fieldset>
            <legend>Additional</legend><br/>
            <label> Mobile Phone: 
                <input type="text" name="phoneNumber" id="phoneNumber" required />
              </label><br/><br/>
          <label> Grade Level: 
            <select name="gradeLevel" id="gradeLevel" required>
            <option value = "">Select</option>
            <option value = "Grade 7">Grade 7</option>
            <option value = "Grade 8">Grade 8</option>
            <option value = "Grade 9">Grade 9</option>
            <option value = "Grade 10">Grade 10</option>
            <option value = "Grade 11">Grade 11</option>
            <option value = "Grade 12">Grade 12</option>
            </select>
          </label><br/><br/>
          <label> Intern/Extern: 
            <input type="radio" name="status" value="Intern" /> Intern
            <input type="radio" name="status" value="Extern" /> Extern
          </label><br/><br/>
          <label> Preferred Organization/Club: 
            <select name="club" id="club" required>
                <option value = "">Select</option>
                <option value="Labuyo">Labuyo</option>
                <option value="Volant">Volant</option>
                <option value="Kislap">Kislap</option>
                <option value="Pallastrp">Pallastro</option>
                <option value="Flux">Flux</option>
                <option value="Pendulum">Pendulum</option>
            </select>
          </label>
          <label> Tell Us About Yourself : 
            <textarea name="about" id="about">
              </textarea>
          </label><br/><br/>
          </fieldset>

        
            
        
          
          
        <fieldset>
          <legend>Action Buttons</legend>
          <button type="submit"> Accept </button>
          <input type="reset" value=" Clear " />
        </fieldset> 
      </form>
    </section>
    <script src="3Q2GCsTejada.js"></script>
  </body>
</html>
